<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>Login</title>
    <link rel="stylesheet" href="login_style.css" />
  </head>
  <body>
    <main>
      <div class="content">
        <h2>Login</h2>
        <div class="elements">
          <div class="element">
            <label for="name">Name</label>
            <input type="text" name="name" id="name" placeholder="ex:lili" />
          </div>

          <div class="element">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" />
          </div>
        </div>
        <a href="crud.html">
          <button>Log in</button>
        </a>
      </div>
    </main>
  </body>
</html>
