<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Shop</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <a href="#Home">Home</a>
        <a href="#New products">New products</a>
        <a href="#Gallery"> Gallery</a>
        <a href="login.html">Account</a>
      </nav>
    </header>
    <main id="Home">
      <div class="containt">
        <h1>Put the</h1>
        <h1>World on</h1>
        <h1>Mute</h1>
      </div>
    </main>
    <section id="New products">
      <h2>New Products</h2>
      <div class="products-all">
        <div class="product">
          <img src="images/product image.jpg" alt="earbuds" />
          <div class="content">
            <div class="details">
              <h3>Beats Solo</h3>
              <h4>$255.00</h4>
            </div>
            <div class="colors">
              <div class="circle r"></div>
              <div class="circle b"></div>
              <div class="circle g"></div>
              <div class="circle gr"></div>
            </div>
          </div>
        </div>
        <div class="product">
          <img src="images/product image (1).jpg" alt="earbuds" />
          <div class="content">
            <div class="details">
              <h3>Beats Solo</h3>
              <h4>$255.00</h4>
            </div>
            <div class="colors">
              <div class="circle r"></div>
              <div class="circle b"></div>
              <div class="circle g"></div>
              <div class="circle gr"></div>
            </div>
          </div>
        </div>
        <div class="product">
          <img src="images/product image (2).jpg" alt="earbuds" />
          <div class="content">
            <div class="details">
              <h3>Beats Solo</h3>
              <h4>$255.00</h4>
            </div>
            <div class="colors">
              <div class="circle r"></div>
              <div class="circle b"></div>
              <div class="circle g"></div>
              <div class="circle gr"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section class="gallery-section" id="Gallery">
      <h2>Gallery</h2>
      <div class="swiper mySwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="images/Slide Image.jpg" alt="headphones" />
          </div>
          <div class="swiper-slide">
            <img src="images/Slide Image (1).jpg" alt="headphones" />
          </div>
          <div class="swiper-slide">
            <img src="images/Slide Image (2).jpg" alt="headphones" />
          </div>
          <div class="swiper-slide">
            <img src="images/Slide Image (3).jpg" alt="headphones" />
          </div>
          <div class="swiper-slide">
            <img src="images/Slide Image (4).jpg" alt="headphones" />
          </div>
        </div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>
    </section>
    <footer>
      <h2>Get in touch</h2>
      <p>Don't forget to call us</p>
      <label for="text">Newsletter</label>
      <input type="text" />
      <p>Adina Vacarciuc</p>
      <p>addycarram@gmail.com</p>
    </footer>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="f.js"></script>
</html>
